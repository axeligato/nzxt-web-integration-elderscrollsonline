<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Elder Scrolls — Kraken Integration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset & base ─────────────────────────────────────── */
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: black;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Uncial Antiqua', serif;
    }

    /* ── Container ───────────────────────────────────────── */
    .container {
      position: relative;
      border-radius: 50%;
      width: 100%;
      height: 100%;
    }

    /* ── Ouroboros image (rotating) ──────────────────────── */
    #ouroboros {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      animation: spin 60s linear infinite;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(-360deg); }
    }

    /* ── Stats overlay ───────────────────────────────────── */
    .data {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .data h1 {
      font-size: 5vw;
      text-transform: uppercase;
      color: #e8dfc8;
      -webkit-text-stroke: 2px #2a2a2a;
    }

    .data p {
      margin: 0;
      font-size: 18.75vw;
      color: #e8dfc8;
      -webkit-text-stroke: 2px #2a2a2a;
      line-height: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <img id="ouroboros" src="./public/ouroboros.png" alt="Ouroboros" />
    <div class="data">
      <h1 id="source">GPU</h1>
      <p><span id="gpu-temp">--</span>°C</p>
    </div>
  </div>

  <script>
    const params = (new URL(window.location.href)).searchParams
    const source = params.get('source') || 'gpu'
    document.getElementById('source').innerText = source.toUpperCase()

    function updateTemperature(temperature) {
      document.getElementById('gpu-temp').innerText = Math.round(temperature)
    }

    // https://github.com/NZXTCorp/web-integrations-types/blob/main/v1/index.d.ts
    window.nzxt = {
      v1: {
        onMonitoringDataUpdate: (data) => {
          const { cpus, gpus } = data
          updateTemperature((source === 'cpu' ? cpus : gpus)[0].temperature)
        }
      }
    }
  </script>
</body>
</html>
